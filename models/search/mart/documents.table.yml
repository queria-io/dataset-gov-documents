schema: search
name: documents
title: 文書
description: |-
  府省のデータセットが持つ文書（PDF）の一覧です。1 行が 1 つのデータセットの 1 つの URL です。

  - dataset は文書を持つ Queria のデータセット（mlit・mhlw・mext・cao・maff・cas・env・soumu・meti）、kind はそのデータセットの中の種類です。white_paper は国土交通白書、plans は行政事業レビューのシートが「関係する計画・通知等」に挙げる PDF です
  - sha256 は PDF の中身の sha256 で、search.pages はこの値で文書を指します。同じ中身の PDF が別の URL で載っていると、sha256 が同じ行が複数あります
  - 行政事業レビューの事業と結び付けるときは、queria/rssystem の review.related_plans の plan_url と url を結合します
  - fetched_url は PDF を取得した URL です。移転したページ（首相官邸のサイトから内閣官房のサイトに移った会議の資料など）では url と異なります
primary_key: [dataset, kind, url]
fields:
  - name: dataset
    title: データセット
  - name: publisher
    title: 府省
  - name: kind
    title: 種類
    description: white_paper（白書）または plans（行政事業レビューが挙げる計画・通知等）
  - name: url
    title: PDF の URL
  - name: fetched_url
    title: 取得した URL
    description: PDF を取得した URL。移転したページでは移転先の URL
  - name: sha256
    title: PDF の sha256
  - name: title
    title: 題名
  - name: page_count
    title: ページ数
  - name: fetched_at
    title: 取得日時
